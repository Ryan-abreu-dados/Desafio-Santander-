<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta Virtual</title>
<style>
  :root {
    --vermelho: #ec0000; --vermelho-escuro: #c40000; --ceu: #deedf2; --ceu-claro: #f2f7f9;
    --tinta: #1b1b1f; --apoio: #6b7076; --linha: #e8ecef; --verde: #0a8a4a; --ambar: #b26a00;
    --sombra: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); background: #f3f4f5; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--vermelho); outline-offset: 2px; }
  svg { display: block; }
  .icone { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* Palco */
  .palco { min-height: 100%; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 24px; }
  .aparelho { width: 402px; height: min(860px, calc(100vh - 48px)); flex: none; background: #101114; border-radius: 52px; padding: 11px; box-shadow: 0 30px 60px rgba(20, 30, 40, .28); }
  .tela { position: relative; height: 100%; background: #fff; border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; }
  .conteudo { flex: 1; overflow-y: auto; scrollbar-width: none; animation: entrar .28s ease; }
  .conteudo::-webkit-scrollbar { display: none; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Topo do app */
  .topo { padding: 54px 20px 2px; }
  .topo-linha { display: flex; align-items: center; justify-content: space-between; }
  .perfil strong { font-size: 25px; font-weight: 700; letter-spacing: -.4px; }
  .icone-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--vermelho); border: 1px solid var(--linha); }

  .cartao-saldo { background: var(--vermelho); color: #fff; margin: 14px 18px 0; border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
  .cartao-saldo::after { content: ""; position: absolute; width: 210px; height: 210px; border-radius: 50%; background: rgba(255,255,255,.08); right: -70px; top: -90px; }
  .cartao-saldo > * { position: relative; z-index: 1; }
  .rotulo { font-size: 13px; color: var(--apoio); }
  .cartao-saldo .rotulo { color: rgba(255,255,255,.88); }
  .valor-grande { font-size: 34px; font-weight: 700; letter-spacing: -.8px; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
  .saldos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid rgba(255,255,255,.3); padding-top: 14px; }
  .saldos strong { display: block; font-size: 16px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .seletor-data { border: 0; background: rgba(255,255,255,.22); color: #fff; border-radius: 8px; padding: 1px 4px; font: inherit; font-size: 12px; font-weight: 600; }
  .seletor-data option { color: var(--tinta); }

  .atalhos { display: grid; grid-template-columns: repeat(4, 1fr); padding: 18px 12px 2px; }
  .atalho { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; }
  .atalho span { width: 58px; height: 58px; border-radius: 14px; border: 1px solid var(--linha); color: var(--vermelho); display: grid; place-items: center; transition: border-color .15s; }
  .atalho:hover span { border-color: var(--vermelho); }

  .secao { padding: 20px 18px 0; }
  .secao-titulo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .secao-titulo h2 { font-size: 17px; font-weight: 650; margin: 0; }
  .link { color: var(--vermelho); font-size: 13.5px; font-weight: 600; }
  .lista { background: #fff; border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--linha); }
  .item:last-child { border-bottom: 0; }
  .item-icone { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--ceu-claro); color: var(--tinta); }
  .item-icone.saida { background: #fdeaea; color: var(--vermelho); }
  .item-icone.entrada { background: #e4f5ec; color: var(--verde); }
  .item-texto { flex: 1; min-width: 0; }
  .item-texto strong { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-texto small { color: var(--apoio); font-size: 12.5px; }
  .item-valor { text-align: right; font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-valor.positivo { color: var(--verde); }
  .selo { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 20px; background: var(--ceu); color: #245567; margin-top: 3px; }
  .selo.ambar { background: #fdf0d9; color: var(--ambar); }
  .selo.verde { background: #e4f5ec; color: var(--verde); }
  .selo.cinza { background: #eceff1; color: var(--apoio); }
  .vazio { padding: 26px 18px; text-align: center; color: var(--apoio); font-size: 14px; }
  .folga { height: 22px; }

  /* Navegação */
  .nav { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border-top: 1px solid var(--linha); padding: 8px 8px 20px; flex: none; }
  .nav button { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; font-size: 11.5px; color: var(--apoio); font-weight: 500; }
  .nav button.ativo { color: var(--vermelho); font-weight: 650; }
  .nav .central span { width: 54px; height: 54px; margin-top: -30px; border-radius: 50%; background: var(--vermelho); color: #fff; display: grid; place-items: center; border: 4px solid #fff; box-sizing: content-box; }

  /* Telas internas */
  .cabecalho { display: flex; align-items: center; gap: 10px; padding: 50px 16px 14px; background: #fff; position: sticky; top: 0; z-index: 2; }
  .cabecalho h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin: 0; }
  .voltar { width: 30px; height: 36px; display: grid; place-items: center; color: var(--vermelho); }
  .abas-app { display: flex; background: #f0f2f4; border-radius: 999px; padding: 4px; margin: 6px 18px 0; }
  .abas-app button { flex: 1; padding: 9px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--apoio); }
  .abas-app button.ativo { background: #fff; color: var(--tinta); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .chips { display: flex; gap: 8px; padding: 14px 18px 0; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--linha); background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 13.5px; font-weight: 550; }
  .chip.ativo { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .prazo { font-size: 12px; color: var(--apoio); }
  .resumo-extrato { margin: 14px 18px 0; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .resumo-extrato strong { display: block; font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dia { font-size: 13px; font-weight: 650; color: var(--apoio); margin: 16px 2px 8px; }

  .form { padding: 22px 20px; }
  .form h2 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.3px; }
  .form p { margin: 0; color: var(--apoio); font-size: 14px; line-height: 1.45; }
  .entrada-valor { width: 100%; border: 0; border-bottom: 2px solid var(--linha); background: none; font: inherit; font-size: 38px; font-weight: 700; padding: 14px 0 10px; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .entrada-valor:focus { outline: none; border-color: var(--vermelho); }
  .detalhes { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 4px 16px; margin-top: 18px; }
  .detalhe { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
  .detalhe:last-child { border-bottom: 0; }
  .detalhe span:first-child { color: var(--apoio); }
  .detalhe span:last-child { font-weight: 600; text-align: right; }
  .nota { display: flex; gap: 10px; background: var(--ceu); border-radius: 14px; padding: 13px; margin-top: 14px; font-size: 13px; line-height: 1.4; color: #1f4453; }
  .nota .icone { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .rodape { padding: 12px 20px 22px; background: #fff; flex: none; }
  .botao { display: block; width: 100%; background: var(--vermelho); color: #fff; font-weight: 650; font-size: 16px; padding: 15px; border-radius: 999px; text-align: center; transition: background .15s; }
  .botao:hover { background: var(--vermelho-escuro); }
  .botao:disabled { background: #d9dde0; color: #8b9095; cursor: default; }
  .botao.secundario { background: #fff; color: var(--vermelho); border: 1.5px solid var(--vermelho); margin-top: 10px; }
  .botao.secundario:hover { background: #fff5f5; }
  .resultado { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 28px; }
  .resultado h2 { font-size: 23px; font-weight: 650; margin: 20px 0 8px; }
  .resultado p { margin: 0; color: var(--apoio); font-size: 14.5px; line-height: 1.45; }
  .selo-grande { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--verde); animation: pular .45s cubic-bezier(.2, 1.5, .4, 1); }
  .selo-grande.erro { background: var(--vermelho); }
  .selo-grande .icone { width: 42px; height: 42px; stroke-width: 2.6; }
  @keyframes pular { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .girar { width: 46px; height: 46px; border: 4px solid var(--linha); border-top-color: var(--vermelho); border-radius: 50%; animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }

  /* Boas-vindas */
  .boas-vindas { flex: 1; background: var(--vermelho); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 28px 40px; }
  .boas-vindas .marca { width: 66px; height: 66px; border-radius: 50%; background: #fff; color: var(--vermelho); display: grid; place-items: center; font-weight: 800; font-size: 24px; margin-bottom: auto; margin-top: 34px; }
  .boas-vindas h1 { font-size: 36px; line-height: 1.1; letter-spacing: -.8px; margin: 0 0 12px; }
  .boas-vindas p { margin: 0 0 28px; font-size: 16px; line-height: 1.45; opacity: .92; }
  .boas-vindas .botao { background: #fff; color: var(--vermelho); }

  /* Folha inferior */
  .veu { position: absolute; inset: 0; background: rgba(15, 20, 25, .42); z-index: 5; display: flex; align-items: flex-end; animation: surgir .2s; }
  @keyframes surgir { from { opacity: 0; } }
  .folha { background: #fff; width: 100%; border-radius: 26px 26px 0 0; padding: 12px 20px 26px; animation: subir .26s ease; max-height: 86%; overflow-y: auto; }
  @keyframes subir { from { transform: translateY(40px); } }
  .alca { width: 40px; height: 4px; border-radius: 3px; background: #d6dbdf; margin: 0 auto 16px; }
  .folha h3 { font-size: 19px; font-weight: 650; margin: 0 0 2px; }
  .passos-op { margin: 16px 0 6px; }
  .passo-op { display: flex; gap: 12px; font-size: 14px; padding-bottom: 14px; position: relative; }
  .passo-op i { width: 12px; height: 12px; border-radius: 50%; background: #d6dbdf; margin-top: 4px; flex: none; }
  .passo-op.feito i { background: var(--verde); }
  .passo-op.alerta i { background: var(--ambar); }
  .passo-op.erro i { background: var(--vermelho); }
  .passo-op:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: 19px; bottom: 0; width: 2px; background: var(--linha); }

  /* Bastidores */
  .bastidores { width: min(720px, calc(100vw - 500px)); height: min(860px, calc(100vh - 48px)); display: flex; flex-direction: column; }
  .bastidores header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 14px; }
  .bastidores h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
  .bastidores header small { display: block; color: var(--apoio); font-size: 13px; margin-top: 1px; }
  .abas-b { display: flex; gap: 4px; background: #e7e9eb; padding: 4px; border-radius: 999px; }
  .abas-b button { padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--apoio); }
  .abas-b button.ativo { background: #fff; color: var(--tinta); }
  .painel-b { flex: 1; overflow-y: auto; display: grid; gap: 12px; align-content: start; padding-right: 2px; }
  .bloco { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid var(--linha); }
  .bloco h3 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  .bloco > p { margin: 0 0 12px; color: var(--apoio); font-size: 13px; line-height: 1.4; }
  .linha-data { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .data-atual { font-size: 22px; font-weight: 700; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .b-chip { border: 1px solid var(--linha); border-radius: 999px; padding: 7px 11px; font-size: 13px; font-weight: 600; background: #fff; }
  .b-chip:hover { border-color: var(--vermelho); color: var(--vermelho); }
  .b-op { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linha); font-size: 13.5px; }
  .b-op div { flex: 1; min-width: 0; }
  .b-op strong { font-weight: 600; }
  .b-op small { display: block; color: var(--apoio); font-size: 12.5px; }
  .b-acao { border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 650; background: var(--verde); color: #fff; }
  .b-acao.neg { background: #fff; color: var(--vermelho); border: 1px solid var(--vermelho); }
  .provas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prova { text-align: left; border: 1px solid var(--linha); border-radius: 12px; padding: 11px 12px; font-size: 13.5px; font-weight: 600; transition: border-color .15s; }
  .prova:hover { border-color: var(--vermelho); }
  .prova small { display: block; color: var(--apoio); font-weight: 400; font-size: 12px; margin-top: 2px; line-height: 1.3; }
  .log { display: grid; gap: 8px; }
  .log div { display: flex; gap: 10px; font-size: 13px; line-height: 1.35; }
  .log time { color: var(--apoio); font-variant-numeric: tabular-nums; flex: none; }
  .log .ok { color: var(--verde); font-weight: 600; }
  .log .barrado { color: var(--vermelho); font-weight: 600; }
  .tabela-b { overflow: auto; border: 1px solid var(--linha); border-radius: 12px; max-height: 620px; }
  .tabela-b table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .tabela-b th, .tabela-b td { padding: 8px 10px; white-space: nowrap; text-align: left; border-bottom: 1px solid var(--linha); }
  .tabela-b th { position: sticky; top: 0; background: var(--ceu); font-weight: 650; }
  .chips-b { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chips-b .b-chip.ativo { background: var(--vermelho); color: #fff; border-color: var(--vermelho); }
  .abrir-b { display: none; }

  @media (max-width: 1050px) {
    .palco { padding: 0; display: block; }
    .aparelho { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .tela { border-radius: 0; }
    .bastidores { display: none; position: fixed; inset: 0; width: 100%; height: 100dvh; background: var(--ceu-claro); padding: 18px; z-index: 20; }
    .bastidores.aberto { display: flex; }
    .abrir-b { display: grid; place-items: center; position: fixed; right: 14px; bottom: 86px; width: 50px; height: 50px; border-radius: 50%; background: var(--tinta); color: #fff; z-index: 10; }
    .fechar-b { display: block !important; }
    .provas { grid-template-columns: 1fr; }
  }
  .fechar-b { display: none; font-weight: 600; font-size: 14px; color: var(--vermelho); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></symbol>
  <symbol id="i-sobe" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-olho" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-olho-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.3 4M6.5 6.6A17 17 0 0 0 2 12s4 7 10 7a10 10 0 0 0 4.4-1"/></symbol>
  <symbol id="i-volta" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-saida" viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></symbol>
  <symbol id="i-entrada" viewBox="0 0 24 24"><path d="M17 7L7 17"/><path d="M15 17H7V9"/></symbol>

</svg>

<div class="palco">
  <div class="aparelho"><div class="tela" id="tela"></div></div>
  <aside class="bastidores" id="bastidores"></aside>
</div>
<button class="abrir-b" id="abrirB" aria-label="Abrir bastidores"><svg class="icone"><use href="#i-engrenagem"/></svg></button>

<script>
const PRODUTOS = [
  { id: "liquidez", nome: "Renda Fixa Liquidez Diária", dias: 0 },
  { id: "plus", nome: "Fundo Renda Fixa Plus", dias: 10 },
  { id: "multi", nome: "Fundo Multimercado", dias: 30 },
];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

const app = {
  conta: null, hoje: "2026-11-01", tela: "inicio", oculto: false, produtos: {},
  saldos: null, ops: [], extrato: null, visao: "efetivo", periodo: "nov", projecao: null,
  fluxo: null, folha: null, aba: "simulador", tabela: "lancamento", linhas: [], log: [], modo: "compra",
};

const guardar = () => { try { localStorage.setItem("conta-virtual", JSON.stringify({ conta: app.conta, hoje: app.hoje, produtos: app.produtos })); } catch (e) {} };
const lembrar = () => { try { return JSON.parse(localStorage.getItem("conta-virtual")) || {}; } catch (e) { return {}; } };

const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icone = (n) => `<svg class="icone"><use href="#i-${n}"/></svg>`;
const moeda = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const mostrar = (v) => app.oculto ? "R$ ••••••" : moeda(v);
const dia = (d) => `${d.slice(8, 10)} ${MESES[Number(d.slice(5, 7)) - 1]}`;
const curta = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
const somar = (d, n) => { const x = new Date(`${d}T12:00:00`); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv-SE"); };
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

async function chamar(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) } : undefined);
  const dados = await r.json();
  if (!r.ok) { const e = new Error(dados.detail); e.status = r.status; throw e; }
  return dados;
}

function nomeOp(op) { return app.produtos[op.operacao_id] || (op.tipo === "VENDA" ? "Venda" : "Compra"); }
const abertas = () => app.ops.filter((o) => ["PROVISIONADO", "PENDENTE"].includes(o.status)).sort((a, b) => a.data_liquidacao.localeCompare(b.data_liquidacao));
const datasProjecao = () => [...new Set([app.hoje, ...abertas().map((o) => o.data_liquidacao)])].sort();

const PERIODOS = { nov: ["2026-11-01", "2026-11-30", "Novembro"], dez: ["2026-12-01", "2026-12-31", "Dezembro"], tudo: ["2026-10-31", "2026-12-31", "Tudo"] };

async function carregar() {
  if (!app.conta) return false;
  try {
    const datas = datasProjecao();
    if (!app.projecao || !datas.includes(app.projecao)) app.projecao = datas[datas.length - 1];
    const [saldos, ops] = await Promise.all([
      chamar(`/contas/${app.conta}/saldos?hoje=${app.hoje}&data_projecao=${app.projecao}`),
      chamar(`/demo/tabelas/operacao?conta_id=${app.conta}`),
    ]);
    app.saldos = saldos; app.ops = ops;
    const [ini, fim] = PERIODOS[app.periodo];
    app.extrato = await chamar(`/contas/${app.conta}/extrato?inicio=${ini}&fim=${fim}&hoje=${app.hoje}&visao=${app.visao}`);
    if (app.aba === "banco") app.linhas = await chamar(`/demo/tabelas/${app.tabela}?conta_id=${app.conta}`);
    return true;
  } catch (e) {
    if (e.status === 404) { app.conta = null; app.saldos = null; guardar(); }
    return false;
  }
}

function registrar(texto, classe) {
  const hora = new Date().toLocaleTimeString("pt-BR");
  app.log.unshift({ hora, texto, classe });
  app.log = app.log.slice(0, 30);
}

}

  return `<div class="item">
    <span class="item-icone ${entrada ? "entrada" : "saida"}">${icone(entrada ? "entrada" : "saida")}</span>
    <span class="item-texto"><strong>${esc(nome)}</strong><span class="selo ${classe}">${esc(l.marca === "AJUSTE" ? "Ajuste" : l.marca)}</span></span>
    <span class="item-valor ${entrada ? "positivo" : ""}">${app.oculto ? "••••" : (entrada ? "+" : "") + moeda(valor)}</span>

/* ---------- Fluxo de compra e venda ---------- */
function telaFluxo() {
  const f = app.fluxo;
  const p = f.produto;
  const compra = f.modo === "compra";
  const titulo = compra ? "Comprar" : "Vender";
  const voltar = `<div class="cabecalho"><button class="voltar" data-fluxo="voltar" aria-label="Voltar">${icone("volta")}</button><h1>${titulo}</h1></div>`;
  const liquidaEm = somar(app.hoje, p.dias);

  if (f.etapa === "valor") {
    const valor = f.centavos / 100;
    return `${voltar}<div class="conteudo"><div class="form">
      <h2>Qual o valor?</h2>
      <p>${esc(p.nome)}</p>
      <input class="entrada-valor" id="valor" inputmode="numeric" value="${moeda(valor)}" aria-label="Valor">
      ${compra ? `<p style="margin-top:10px">Disponível: <strong style="color:var(--tinta)">${moeda(app.saldos.disponivel)}</strong></p>` : ""}
      <div class="chips" style="padding:16px 0 0">${[20000, 30000, 40000, 50000].map((v) => `<button class="chip" data-rapido="${v}">${v / 1000} mil</button>`).join("")}</div>
    </div></div>
    <div class="rodape"><button class="botao" data-fluxo="revisar" id="continuar" ${valor > 0 ? "" : "disabled"}>Continuar</button></div>`;
  }

  if (f.etapa === "revisao") {
    const valor = f.centavos / 100;
    const depois = Number(app.saldos.disponivel) - valor;
    return `${voltar}<div class="conteudo"><div class="form">
      <h2>Confira os dados</h2>
      <div class="detalhes">
        <div class="detalhe"><span>Produto</span><span>${esc(p.nome)}</span></div>
        <div class="detalhe"><span>Valor</span><span>${moeda(valor)}</span></div>
        <div class="detalhe"><span>Data da operação</span><span>${dia(app.hoje)}</span></div>
        <div class="detalhe"><span>Liquidação</span><span>${dia(liquidaEm)} (D+${p.dias})</span></div>
        ${compra ? `<div class="detalhe"><span>Disponível depois</span><span>${moeda(depois)}</span></div>` : ""}
      </div>
      <div class="nota">${icone("info")}<span>${compra ? "Vamos reservar esse valor agora. Ele sai do saldo efetivo só na data da liquidação." : "Esse valor entra no saldo projetado agora e no efetivo só na liquidação."}</span></div>
    </div></div>
    <div class="rodape"><button class="botao" data-fluxo="confirmar">Confirmar ${compra ? "compra" : "venda"}</button></div>`;
  }

  if (f.etapa === "enviando") return `<div class="resultado"><div class="girar"></div><h2>Processando</h2><p>${compra ? "Reservando o seu saldo" : "Registrando a sua venda"}</p></div>`;

  if (f.etapa === "ok") return `<div class="resultado">
      <div class="selo-grande">${icone("ok")}</div>
      <h2>${compra ? "Compra registrada" : "Venda registrada"}</h2>
      <p>${moeda(f.centavos / 100)} em ${esc(p.nome)}.<br>Liquida em ${dia(liquidaEm)}.</p>
    </div>
    <div class="rodape"><button class="botao" data-ir="inicio">Voltar ao início</button><button class="botao secundario" data-ir="agenda">Ver na agenda</button></div>`;

  return `<div class="resultado">
      <div class="selo-grande erro">${icone("x")}</div>
      <h2>Compra recusada</h2>
      <p>${esc(f.motivo)}</p>
    </div>
    <div class="rodape"><button class="botao" data-ir="inicio">Voltar ao início</button></div>`;
}

async function confirmarFluxo() {
  const f = app.fluxo;
  const valor = f.centavos / 100;
  f.etapa = "enviando"; desenhar();
  const corpo = { conta_id: app.conta, valor, data_liquidacao: somar(app.hoje, f.produto.dias), ocorrido_em: `${app.hoje}T10:00:00` };
  await espera(600);
  try {
    const r = await chamar(f.modo === "compra" ? "/compras" : "/vendas", corpo);
    app.produtos[r.operacao_id] = f.produto.nome; guardar();
    f.etapa = "ok";
    registrar(f.modo === "compra" ? `Saldo reservado e CompraCriada publicado: ${moeda(valor)}` : `VendaCriada publicado: ${moeda(valor)}`, "ok");
    atualizarLogo();
  } catch (e) {
    if (e.status !== 409) { f.etapa = "erro"; f.motivo = e.message; desenhar(); return; }
    f.etapa = "erro";
    f.motivo = `Seu disponível é de ${moeda(app.saldos.disponivel)}. O banco recusou a reserva, e nenhum evento foi gerado.`;
    registrar(`Reserva recusada por falta de saldo: ${moeda(valor)}`, "barrado");
  }
  desenhar();
}

  if (!op) return "";
  const pendente = op.status === "PENDENTE";
  const compra = op.natureza === "DEBITO";
  return `<div class="veu" data-fechar-folha="1"><div class="folha" data-folha="1">
    <div class="alca"></div>
    <h3>${esc(nomeOp(op))}</h3>
    <div class="rotulo">${compra ? "Compra" : "Venda"} de ${moeda(op.valor)}</div>
    <div class="passos-op">
      <div class="passo-op feito"><i></i><span>${compra ? "Saldo reservado" : "Venda registrada"}</span></div>
      <div class="passo-op ${pendente ? "alerta" : ""}"><i></i><span>${pendente ? "Liquidação em análise" : `Aguardando liquidação em ${dia(op.data_liquidacao)}`}</span></div>
      <div class="passo-op"><i></i><span>Saldo efetivo atualizado</span></div>
    </div>
    <button class="botao secundario" data-cancelar="${esc(op.operacao_id)}">Cancelar operação</button>
  </div></div>`;
}

/* ---------- Bastidores ---------- */
function desenharBastidores() {
  const el = document.getElementById("bastidores");
  const cab = `<header><div><h2>Bastidores do sistema</h2><small>${app.conta ? esc(app.conta) : "Nenhuma conta aberta"}</small></div>
    <div style="display:flex;gap:12px;align-items:center"><button class="fechar-b" data-fechar-b="1">Fechar</button><div class="abas-b">${[["simulador", "Simulador"], ["banco", "Banco de dados"]].map(([v, r]) => `<button data-aba="${v}" class="${app.aba === v ? "ativo" : ""}">${r}</button>`).join("")}</div></div></header>`;
  const corpo = !app.conta
    ? `<div class="painel-b"><div class="bloco"><h3>Abra a conta no aplicativo</h3><p style="margin:0">Os controles aparecem depois que a conta existir.</p></div></div>`
    : app.aba === "banco" ? blocoBanco() : blocoSimulador();
  if (cab + corpo === desenhado.bastidores) return;
  desenhado.bastidores = cab + corpo;
  const rolagem = el.querySelector(".painel-b")?.scrollTop || 0;
  el.innerHTML = cab + corpo;
  const painel = el.querySelector(".painel-b");
  if (painel) painel.scrollTop = rolagem;
}

        <button class="prova" data-prova="reenviar">Enviar evento repetido<small>Mesmo id_evento pelo Kafka</small></button>
        <button class="prova" data-prova="fechar">Fechar o dia ${curta(app.hoje)}<small>Grava a foto e trava o dia</small></button>
        <button class="prova" data-prova="conciliar">Conciliar com erro na B3<small>Diferença de R$ 1.000 em ${curta(app.hoje)}</small></button>

function blocoBanco() {
  const nomes = ["lancamento", "operacao", "saldo_conta", "fechamento_diario", "evento_processado", "outbox", "divergencia"];
  const colunas = app.linhas.length ? Object.keys(app.linhas[0]) : [];
  const celula = (v) => esc(v === null ? "" : typeof v === "object" ? JSON.stringify(v) : v);
  return `<div class="painel-b"><div class="bloco">
    <div class="chips-b">${nomes.map((n) => `<button class="b-chip ${app.tabela === n ? "ativo" : ""}" data-tabela="${n}">${n}</button>`).join("")}</div>
    <div class="tabela-b">${colunas.length ? `<table><tr>${colunas.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${app.linhas.map((l) => `<tr>${colunas.map((c) => `<td>${celula(l[c])}</td>`).join("")}</tr>`).join("")}</table>` : `<div class="vazio">Sem linhas nesta tabela.</div>`}</div>
  </div></div>`;

/* ---------- Desenho e eventos ---------- */
function desenhar() {
  const tela = document.getElementById("tela");
  const rolagem = tela.querySelector(".conteudo")?.scrollTop || 0;
  const mesmaTela = tela.dataset.chave === chaveTela();
  let html;
  if (!app.conta || !app.saldos || !app.extrato) html = app.conta ? "" : telaBoasVindas();
  else if (app.fluxo && app.fluxo.etapa !== "fim") html = telaFluxo();
  else html = { inicio: telaInicio, extrato: telaExtrato, agenda: telaAgenda, investir: telaInvestir }[app.tela]();
  html += app.folha ? folhaOp() : "";
  if (html !== desenhado.tela) { // redesenhar sem mudança reiniciaria as animações
    desenhado.tela = html;
    tela.innerHTML = html;
    tela.dataset.chave = chaveTela();
    const cont = tela.querySelector(".conteudo");
    if (cont && mesmaTela) { cont.style.animation = "none"; cont.scrollTop = rolagem; }
    const entrada = document.getElementById("valor");
    if (entrada) { entrada.focus(); entrada.setSelectionRange(99, 99); }
  }
  desenharBastidores();
}
const desenhado = { tela: null, bastidores: null };
const chaveTela = () => `${app.conta}-${app.tela}-${app.fluxo?.etapa || ""}`;

async function atualizarLogo() {
  for (let i = 0; i < 8; i++) { await espera(450); await carregar(); pintarSeguro(); }
}
function pintarSeguro() { if (document.activeElement?.id !== "projecao" && !(app.fluxo && app.fluxo.etapa === "valor")) desenhar(); }

async function acaoProva(tipo) {
  const c = app.conta;
  if (tipo === "reenviar") {
    const antes = (await chamar(`/demo/tabelas/lancamento?conta_id=${c}`)).length;
    let r; try { r = await chamar("/demo/reenviar", { conta_id: c }); } catch (e) { registrar("Ainda não há evento para reenviar.", "barrado"); return; }
    registrar(`${r.tipo} enviado de novo. Aguardando o Ledger`);
    desenhar(); await espera(2200);
    const depois = (await chamar(`/demo/tabelas/lancamento?conta_id=${c}`)).length;
    registrar(`Evento repetido barrado. Linhas no livro: ${antes} antes, ${depois} depois.`, "ok");
  } else if (tipo === "fechar") {
    const r = await chamar("/demo/fechar", { conta_id: c, dia: app.hoje });
    registrar(r.contas_fechadas ? `Dia ${curta(app.hoje)} fechado e travado.` : `O dia ${curta(app.hoje)} já estava fechado.`, "ok");
  } else if (tipo === "conciliar") {
    const r = await chamar("/demo/conciliar", { conta_id: c, dia: app.hoje, erro_b3: 1000 });
    registrar(r.divergencias ? `${r.divergencias} divergência registrada em ${curta(app.hoje)}.` : `Nada novo: feche o dia ${curta(app.hoje)} antes de conciliar, ou a diferença já foi registrada.`, r.divergencias ? "barrado" : "");
  } else if (tipo === "update-app" || tipo === "update-demo") {
    const r = await chamar("/demo/alterar", { conta_id: c, usuario: tipo === "update-app" ? "app" : "demo" });
    registrar(r.recusado ? `Banco recusou: ${r.erro}` : "O banco aceitou o UPDATE.", "barrado");
  } else if (tipo === "nova") {
    const n = await chamar("/demo/proxima-conta");
    app.conta = null; app.saldos = null; app.extrato = null; app.ops = []; app.hoje = "2026-11-01"; app.tela = "inicio"; app.log = []; app.fluxo = null; app.projecao = null;
    guardar(); registrar(`Próxima conta será ${n.conta_id}.`);
  }
}

document.addEventListener("click", async (ev) => {
  const alvo = ev.target.closest("button, [data-fechar-folha]");
  if (!alvo) return;
  const d = alvo.dataset;

  if (d.folha) return;
  if (d.fecharFolha !== undefined && !ev.target.closest(".folha")) { app.folha = null; desenhar(); return; }

  if (d.ir) { app.tela = d.ir; if (d.modo) app.modo = d.modo; app.fluxo = null; app.folha = null; desenhar(); return; }
  if (d.op) { app.folha = d.op; desenhar(); return; }
  if (d.modoAba) { app.modo = d.modoAba; desenhar(); return; }
  if (d.visao) { app.visao = d.visao; await carregar(); desenhar(); return; }
  if (d.periodo) { app.periodo = d.periodo; await carregar(); desenhar(); return; }
  if (d.produto) { app.fluxo = { modo: app.modo, produto: PRODUTOS.find((p) => p.id === d.produto), etapa: "valor", centavos: 0 }; desenhar(); return; }
  if (d.rapido) { app.fluxo.centavos = Number(d.rapido) * 100; desenhar(); return; }
  if (d.fluxo === "voltar") { if (app.fluxo.etapa === "revisao") app.fluxo.etapa = "valor"; else app.fluxo = null; desenhar(); return; }
  if (d.fluxo === "revisar") { app.fluxo.etapa = "revisao"; desenhar(); return; }
  if (d.fluxo === "confirmar") { confirmarFluxo(); return; }
  if (d.acao === "olho") { app.oculto = !app.oculto; desenhar(); return; }
  if (d.acao === "abrir") {
    const n = await chamar("/demo/proxima-conta");
    await chamar("/demo/abrir", { conta_id: n.conta_id, valor: 100000, dia: "2026-10-31" });
    await chamar("/demo/fechar", { conta_id: n.conta_id, dia: "2026-10-31" });
    app.conta = n.conta_id; app.hoje = "2026-11-01"; app.produtos = {}; app.projecao = null; guardar();
    registrar(`Conta ${n.conta_id} aberta com R$ 100.000.`, "ok");
    await carregar(); desenhar(); return;
  }
  if (d.cancelar) {
    await chamar(`/operacoes/${d.cancelar}/cancelar`, { operacao_id: d.cancelar, ocorrido_em: `${app.hoje}T12:00:00` });
    registrar("OperacaoCancelada publicado. O valor volta ao disponível.", "ok");
    app.folha = null; desenhar(); atualizarLogo(); return;
  }
  if (d.aba) { app.aba = d.aba; await carregar(); desenhar(); return; }
  if (d.tabela) { app.tabela = d.tabela; await carregar(); desenhar(); return; }
  if (d.hoje) { app.hoje = d.hoje; app.projecao = null; guardar(); registrar(`Data do sistema: ${curta(app.hoje)}.`); await carregar(); desenhar(); return; }
  if (d.liquidar || d.falhar) {
    const operacao_id = d.liquidar || d.falhar;
    await chamar(d.liquidar ? "/demo/liquidar" : "/demo/falhar", { operacao_id, ocorrido_em: `${app.hoje}T18:00:00` });
    registrar(d.liquidar ? "LiquidacaoConfirmada publicado. Efetivo será atualizado." : "LiquidacaoFalhou publicado. Valor segue reservado.", d.liquidar ? "ok" : "barrado");
    desenhar(); atualizarLogo(); return;
  }
  if (d.prova) { await acaoProva(d.prova); await carregar(); desenhar(); return; }
  if (d.fecharB) { document.getElementById("bastidores").classList.remove("aberto"); return; }
  if (alvo.id === "abrirB") { document.getElementById("bastidores").classList.add("aberto"); return; }
});

document.addEventListener("input", (ev) => {
  if (ev.target.id !== "valor") return;
  const centavos = Number(ev.target.value.replace(/\D/g, "")) || 0;
  app.fluxo.centavos = Math.min(centavos, 99999999999);
  ev.target.value = moeda(app.fluxo.centavos / 100);
  document.getElementById("continuar").disabled = app.fluxo.centavos <= 0;
});

document.addEventListener("change", async (ev) => {
  if (ev.target.id === "projecao") { app.projecao = ev.target.value; ev.target.blur(); await carregar(); desenhar(); }
});

(async function iniciar() {
  const salvo = lembrar();
  app.conta = salvo.conta || null; app.hoje = salvo.hoje || app.hoje; app.produtos = salvo.produtos || {};
  await carregar(); await carregar(); desenhar();
  setInterval(async () => { if (app.conta) { await carregar(); pintarSeguro(); } }, 2500);
})();
</script>
</body>
